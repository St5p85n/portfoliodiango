{% extends 'layout.html' %}
{% block content %}
<div class="container">
    <div class="container-fluid">
        <div class="row">
             <div class="col-md-4">

                <form action="{% url 'ajoutUtil' %}" method="post">
                    {% csrf_token %}
                    <label>Nom : </label><input class="form-control" type="text" name="username">
                    <label>Prenom : </label><input class="form-control" type="text" name="last_name">
                    <label>Email : </label><input class="form-control" type="text" name="email">
                    <label>Telephone : </label><input class="form-control" type="text" name="telephone">
                    <label>Adresse : </label><input class="form-control" type="text" name="address">
                    <label>Mot de pass : </label><input class="form-control" type="text" name="password">
                    <button type="submit" class="btn btn-dark" style="margin-top: 10px">Ajouter</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock%}
